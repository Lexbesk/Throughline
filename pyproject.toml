[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-notes-todos"
version = "0.1.0"
description = "Turn unstructured meeting notes into structured, deduplicated TODO items via an LLM."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "dateparser>=1.2",
    "rapidfuzz>=3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
meeting-notes-todos = "meeting_notes_todos.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
